[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secureflow-api"
version = "0.1.0"
description = "SecureFlow DevSecOps portfolio API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.10.0",
    "pydantic-settings>=2.7.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "S105"]
